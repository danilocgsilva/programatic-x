[project]
name = "programatic-x"
version = "1.4.1"
dependencies = [
    "pyautogui",
    "pillow",
    "opencv-python",
    "pynput",
    "numpy"
]

[tool.setuptools.packages.find]
exclude = [
    "active_tests*",
    "build*",
    "dist*"
]

[tool.setuptools.package-data]
"programatic_x" = ["assets/*.png"]